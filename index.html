<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SalsadData</title><style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:#f0f5f3;
color:#18352b;
}
header{
background:#087b50;
color:white;
padding:25px;
text-align:center;
}
header h1{margin:0;font-size:28px}
.container{padding:16px;max-width:500px;margin:auto}
.card{
background:white;
padding:20px;
border-radius:14px;
margin-bottom:16px;
box-shadow:0 3px 12px #00000010;
}
.balance{
background:linear-gradient(120deg,#087b50,#16a36b);
color:white;
}
.balance h2{font-size:32px;margin:12px 0}
input,select{
width:100%;
padding:14px;
margin:9px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}
button{
background:#087b50;
color:white;
border:0;
padding:14px;
border-radius:8px;
width:100%;
font-size:16px;
margin-top:10px;
cursor:pointer;
}
button:active{background:#055b3a}
.history-item{
padding:12px 0;
border-bottom:1px solid #eee;
}
footer{text-align:center;padding:20px;color:#777}
</style></head><body><header>
<h1>SalsadData</h1>
<p>Fast, Secure & Reliable</p>
</header><div class="container"><div class="card balance">
<h3>My Wallet</h3>
<h2 id="balance">₦0.00</h2>
<p>Available Balance</p>
</div><div class="card">
<h3>💰 Add Money</h3>
<input type="number" id="deposit" placeholder="Enter Amount ₦">
<button onclick="addMoney()">Add Money</button>
</div><div class="card">
<h3>📱 Buy Airtime</h3><select id="airtimeNetwork">
<option value="">Select Network</option>
<option>MTN</option>
<option>AIRTEL</option>
<option>GLO</option>
<option>9MOBILE</option>
</select><input type="tel" id="airtimePhone" placeholder="Enter Phone Number" maxlength="11"><input type="number" id="airtimeAmount" placeholder="Enter Amount ₦"><button onclick="buyAirtime()">Continue</button>

</div><div class="card">
<h3>🌐 Buy Data</h3><select id="dataNetwork">
<option value="">Select Network</option>
<option>MTN</option>
<option>AIRTEL</option>
<option>GLO</option>
<option>9MOBILE</option>
</select><input type="tel" id="dataPhone" placeholder="Enter Phone Number" maxlength="11"><select id="dataAmount">
<option value="">Select Data Plan</option>
<option value="100">₦100</option>
<option value="200">₦200</option>
<option value="500">₦500</option>
<option value="1000">₦1,000</option>
<option value="2000">₦2,000</option>
</select><button onclick="buyData()">Continue</button>

</div><div class="card">
<h3>📜 Transaction History</h3>
<div id="history">No transactions yet.</div>
</div></div><footer>
<p>Welcome to SalsadData</p>
<p>Fast, Secure & Reliable</p>
</footer><script>

let balance=Number(localStorage.getItem("salsad_balance"))||0;

let history=JSON.parse(localStorage.getItem("salsad_history")||"[]");

function updateDisplay(){

document.getElementById("balance").innerText=
"₦"+balance.toLocaleString("en-NG",{minimumFractionDigits:2});

let box=document.getElementById("history");

if(history.length===0){
box.innerHTML="No transactions yet.";
}else{
box.innerHTML=history.map(item=>
`<div class="history-item">
${item.name}<br>
<small>${item.phone} | ${item.date}</small>
<strong style="float:right">${item.amount}</strong>
</div>`
).join("");
}

localStorage.setItem("salsad_balance",balance);
localStorage.setItem("salsad_history",JSON.stringify(history));

}

function record(name,phone,amount){

history.unshift({
name:name,
phone:phone,
amount:amount,
date:new Date().toLocaleString()
});

}

function validPhone(phone){
return /^0[789][01]\d{8}$/.test(phone);
}

function addMoney(){

let amount=Number(document.getElementById("deposit").value);

if(!amount||amount<=0){
alert("Enter a valid amount");
return;
}

balance+=amount;

record("Demo Wallet Deposit","-", "+₦"+amount.toLocaleString());

updateDisplay();

document.getElementById("deposit").value="";

alert("Demo deposit successful!");

}

function buyAirtime(){

let network=document.getElementById("airtimeNetwork").value;
let phone=document.getElementById("airtimePhone").value.trim();
let amount=Number(document.getElementById("airtimeAmount").value);

if(!network||!phone||!amount){
alert("Please complete all fields");
return;
}

if(!validPhone(phone)){
alert("Enter a valid 11-digit Nigerian phone number");
return;
}

if(balance<amount){
alert("Insufficient Balance. Please add money.");
return;
}

if(!confirm("Confirm ₦"+amount+" "+network+" airtime for "+phone+"?"))return;

balance-=amount;

record(network+" Airtime",phone,"-₦"+amount.toLocaleString());

updateDisplay();

document.getElementById("airtimePhone").value="";
document.getElementById("airtimeAmount").value="";

alert("Demo transaction successful!");

}

function buyData(){

let network=document.getElementById("dataNetwork").value;
let phone=document.getElementById("dataPhone").value.trim();
let amount=Number(document.getElementById("dataAmount").value);

if(!network||!phone||!amount){
alert("Please complete all fields");
return;
}

if(!validPhone(phone)){
alert("Enter a valid 11-digit Nigerian phone number");
return;
}

if(balance<amount){
alert("Insufficient Balance. Please add money.");
return;
}

if(!confirm("Confirm ₦"+amount+" "+network+" data for "+phone+"?"))return;

balance-=amount;

record(network+" Data",phone,"-₦"+amount.toLocaleString());

updateDisplay();

document.getElementById("dataPhone").value="";
document.getElementById("dataAmount").value="";

alert("Demo transaction successful!");

}

updateDisplay();

</script></body>
</html>
