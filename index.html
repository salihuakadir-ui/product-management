}

button {

  color: white;
  border: none;
  padding: 13px;
  width: 100%;
  border-radius: 8px;
  margin-top: 10px;
  font-size: 16px;
}

button:active {
  background: #055c42;
}

input, select {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  box-sizing: border-box;
  border: 1px solid #ccc;
  border-radius: 7px;
}
</style>
</head>

<body>

<div class="container">

<header>
<h1>SalsadData</h1>
<p>Fast, Secure & Reliable</p>

<button onclick="addMoney()">Add Money</button>

<input type="number" id="airtimeAmount" placeholder="Enter Amount">
<button onclick="buyAirtime()">Continue</button>

</div>

<div class="card">

<ul id="history"></ul>

</div>

}

function addMoney() {
 let amount = Number(prompt("Enter amount to add:"));
 if(amount > 0) {
 balance += amount;
 updateBalance();
 alert("Money added successfully!");
 }
}

function buyAirtime() {

 alert("Insufficient wallet balance");
 return;

 balance -= amount;

 addHistory(network + " Airtime - ₦" + amount);
 alert("Transaction Successful!");
}
