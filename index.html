<div class="wallet">
  <h3>My Wallet</h3>
  <h2 id="salsadBalance">₦0.00</h2>

  <input type="number" id="addAmount"
  placeholder="Enter Amount (₦100 minimum)">

  <button onclick="fundWallet()">
    Add Money
  </button>

  <p id="walletMessage"></p>
</div>

<script>
let balance = Number(localStorage.getItem("salsadBalance")) || 0;

function showBalance() {
  document.getElementById("salsadBalance").innerText =
    "₦" + balance.toFixed(2);
}

function fundWallet() {
  let amount = Number(document.getElementById("addAmount").value);

  if (amount < 100) {
    alert("Minimum amount is ₦100");
    return;
  }

  balance += amount;
  localStorage.setItem("salsadBalance", balance);

  showBalance();

  document.getElementById("walletMessage").innerText =
    "Wallet updated successfully!";

  document.getElementById("addAmount").value = "";
}

showBalance();
</script>
