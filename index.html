<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SalsadData</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f0f4f8;
  margin: 0;
  text-align: center;
}

header {
  background: #0645ad;
  color: white;
  padding: 25px;
}

header h1 {
  margin: 0;
}

.container {
  padding: 25px;
}

.wallet {

.card {

  padding: 20px;

  max-width: 400px;
  border-radius: 10px;
}

button {
  background: #0645ad;
  color: white;
  padding: 12px 25px;
  border: none;
  border-radius: 6px;
}
</style>

<body>

<header>

</header>

<div class="wallet">
<h2>My Wallet</h2>
<h3>₦0.00</h3>
<button>Add Money</button>
</div>

<div class="card">
<h3>Buy Data</h3>

</div>

<div class="card">
<h3>Buy Airtime</h3>

</div>
